name: M1 Trigger Scan

on:
  schedule:
    # GitHub Actions รองรับ cron ต่ำสุดจริง ๆ ได้ประมาณ 5 นาที (และมักดีเลย์เพิ่มอีก 2-10 นาทีตามคิวจริง)
    # ถ้าต้องการความถี่ระดับ 1 นาทีจริง ให้ดู README.md หัวข้อ "ทางเลือก hosting" แทน
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run M1 trigger scan
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_IDS: ${{ secrets.LINE_TARGET_IDS }}
        run: python main.py

      - name: Commit updated state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update state.json [skip ci]"
          git push
