name: Forex Scan Schedule

on:
  schedule:
    # เวลาไทย (UTC+7): 08:00, 10:00, 13:00, 15:00, 19:00
    - cron: "0 1,3,6,8,12 * * *"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run scan
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TARGET_IDS: ${{ secrets.LINE_TARGET_IDS }}
        run: python main_scan.py
      - name: Commit updated state
        run: |
          git config user.name "forex-bot"
          git config user.email "forex-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update state [skip ci]"
          git push
